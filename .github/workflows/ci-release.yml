name: CI Release

on:
  push:

permissions:
  contents: write

jobs:
  build-bump-pack-release:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Bump patch version
        run: npm run bump:patch

      - name: Pack extension
        run: npm run pack:ci

      - name: Capture version and package path
        id: metadata
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX_FILE="$(ls -1 *.vsix | head -n 1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=${VSIX_FILE}" >> "$GITHUB_OUTPUT"

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.metadata.outputs.version }} [skip ci]"
          git push

      - name: Create and push tag
        run: |
          git tag "${{ steps.metadata.outputs.tag }}"
          git push origin "${{ steps.metadata.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.tag }}
          files: ${{ steps.metadata.outputs.vsix }}
