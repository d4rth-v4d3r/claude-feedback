name: Publish Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Validate publisher
        run: |
          PUBLISHER="$(node -p "require('./package.json').publisher")"
          if [ "${PUBLISHER}" = "local" ]; then
            echo "publisher is set to 'local'. Update package.json publisher before publishing."
            exit 1
          fi

      - name: Pack extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          npx @vscode/vsce publish --packagePath "${NAME}-${VERSION}.vsix"
