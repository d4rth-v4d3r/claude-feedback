name: Publish Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Validate publisher
        run: |
          PUBLISHER="$(node -p "require('./package.json').publisher")"
          if [ "${PUBLISHER}" = "local" ]; then
            echo "publisher is set to 'local'. Update package.json publisher before publishing."
            exit 1
          fi

      - name: Pack extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Capture extension metadata
        id: metadata
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set +e
          OUTPUT="$(npx @vscode/vsce publish --packagePath "${{ steps.metadata.outputs.vsix }}" 2>&1)"
          STATUS=$?
          set -e
          echo "${OUTPUT}"
          if [ ${STATUS} -ne 0 ]; then
            if echo "${OUTPUT}" | grep -qi "already exists"; then
              echo "VS Marketplace already has ${{ steps.metadata.outputs.name }} v${{ steps.metadata.outputs.version }}. Continuing."
            else
              exit ${STATUS}
            fi
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set +e
          OUTPUT="$(npx ovsx publish --packagePath "${{ steps.metadata.outputs.vsix }}" -p "${OVSX_PAT}" 2>&1)"
          STATUS=$?
          set -e
          echo "${OUTPUT}"
          if [ ${STATUS} -ne 0 ]; then
            if echo "${OUTPUT}" | grep -Eqi "already exists|version exists|duplicate"; then
              echo "Open VSX already has ${{ steps.metadata.outputs.name }} v${{ steps.metadata.outputs.version }}. Continuing."
            else
              exit ${STATUS}
            fi
          fi
